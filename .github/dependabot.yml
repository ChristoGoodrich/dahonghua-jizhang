version: 2
updates:
  # No npm block. `package.json` declares no dependencies at all — Node is
  # here only to run `node scripts/…`, and the app has no JavaScript in it.
  # What used to be here ignored Expo, React Native, jest, storybook and
  # detox, none of which have existed since the rewrite.
  #
  # Rust and Flutter are not watched either. Adding `cargo` and `pub`
  # ecosystems would be the real replacement, and is a decision about wanting
  # the pull requests rather than a cleanup.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
