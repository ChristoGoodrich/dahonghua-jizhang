name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Check coverage threshold
        run: |
          SUMMARY=coverage/coverage-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::coverage-summary.json not found. Ensure tests ran with --coverage."
            exit 1
          fi
          LINE_PCT=$(node -e "const s=require('./$SUMMARY'); console.log(s.total.lines.pct)")
          echo "Line coverage: ${LINE_PCT}%"
          if [ "$(node -e "console.log(${LINE_PCT} < 70 ? 'fail' : 'pass')")" = "fail" ]; then
            echo "::error::Line coverage ${LINE_PCT}% is below the 70% threshold."
            exit 1
          fi
          echo "Coverage threshold met (${LINE_PCT}% >= 70%)."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: cargo-

      - name: Rust format
        run: npm run rust:fmt

      - name: Rust lint
        run: npm run rust:clippy

      - name: Rust tests
        run: npm run rust:test

      # The migration's real gate: the Rust port must answer identically to the
      # TypeScript still shipping to users, case for case.
      - name: TypeScript ↔ Rust parity
        run: npm run parity

      # The bridge is its own cargo project, outside the rust/ workspace, so
      # `rust:clippy` never saw it — two thousand lines of Rust that had been
      # checked only by hand, every time, by whoever remembered.
      - name: Bridge format
        run: npm run bridge:fmt

      - name: Bridge lint
        run: npm run bridge:clippy

      # A test file that is not imported by all_test.dart is a test file that
      # silently stopped running, which is worse than one that fails.
      - name: Integration suite is complete
        run: npm run tests:check

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust for the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            flutter_app/rust_bridge/target
          key: bridge-${{ hashFiles('flutter_app/rust_bridge/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: bridge-

      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      # The whole suite in one entrypoint. Per-file it was 33 APK builds and
      # about twenty minutes; this is one build and about five, which is what
      # makes running it on every push affordable at all.
      - name: Integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: flutter_app
          script: flutter test integration_test/all_test.dart
