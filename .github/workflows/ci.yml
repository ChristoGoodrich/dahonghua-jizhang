name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Rust, and the goldens.
  #
  # No `npm ci` and no node_modules: the React Native tree is gone and every
  # script left is plain Node. `goldens` holds the core to the answers the
  # TypeScript gave on the day it was removed — scripts/goldens.js says what
  # that does and does not still prove.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: cargo-

      - name: Rust format
        run: npm run rust:fmt

      - name: Rust lint
        run: npm run rust:clippy

      - name: Rust tests
        run: npm run rust:test

      # The bridge is its own cargo project, outside the rust/ workspace, so
      # `rust:clippy` does not reach it.
      - name: Bridge format
        run: npm run bridge:fmt

      - name: Bridge lint
        run: npm run bridge:clippy

      - name: Goldens
        run: npm run goldens

      # A test file not imported by all_test.dart is a test file that silently
      # stopped running, which is worse than one that fails.
      - name: Integration suite is complete
        run: npm run tests:check

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust for the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            flutter_app/rust_bridge/target
          key: bridge-${{ hashFiles('flutter_app/rust_bridge/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: bridge-

      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      # The whole suite in one entrypoint. Per file it was 33 APK builds and
      # about twenty minutes; this is one build and about five, which is what
      # makes running it on every push affordable at all.
      - name: Integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: flutter_app
          script: flutter test integration_test/all_test.dart

      - name: Release APK builds
        working-directory: flutter_app
        run: flutter build apk --release
