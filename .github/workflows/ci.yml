name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Rust, and the goldens.
  #
  # No `npm ci` and no node_modules: the React Native tree is gone and every
  # script left is plain Node. `goldens` holds the core to the answers the
  # TypeScript gave on the day it was removed — scripts/goldens.js says what
  # that does and does not still prove.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: cargo-

      - name: Rust format
        run: npm run rust:fmt

      - name: Rust lint
        run: npm run rust:clippy

      - name: Rust tests
        run: npm run rust:test

      # The bridge is its own cargo project, outside the rust/ workspace, so
      # `rust:clippy` does not reach it.
      - name: Bridge format
        run: npm run bridge:fmt

      - name: Bridge lint
        run: npm run bridge:clippy

      - name: Goldens
        run: npm run goldens

      # A test file not imported by all_test.dart is a test file that silently
      # stopped running, which is worse than one that fails.
      - name: Integration suite is complete
        run: npm run tests:check

      # Chinese text takes ，；：（）. Fifty-two strings had drifted to ASCII
      # before anything looked.
      - name: Chinese punctuation
        run: npm run zh:check

  flutter:
    runs-on: ubuntu-latest
    # Measured on 2026-10-26, on a runner with no GPU: about 12 minutes to the
    # first test (Flutter, the emulator, the debug build), about 32 for the
    # suite with animations on — the blur is rendered in software — and then
    # the release build. 45 cut the release build off 36 seconds in.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust for the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            flutter_app/rust_bridge/target
          key: bridge-${{ hashFiles('flutter_app/rust_bridge/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: bridge-

      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      # The Kotlin components' own rules — which notifications to keep, which
      # colour the widget paints, which receivers the manifest owes the
      # reminder plugin. JVM-only, no emulator, but not Flutter-free: the
      # Gradle wrapper is gitignored and generated by Flutter, and the app
      # module needs the SDK and the plugins. This step used to sit in the
      # core job, which has neither, and died on "./gradlew: not found" —
      # unseen, because rustfmt failed first on every run since it was added.
      # `--config-only` writes the wrapper without building anything.
      - name: Kotlin unit tests
        working-directory: flutter_app
        run: |
          flutter build apk --debug --config-only
          cd android && ./gradlew :app:testDebugUnitTest --console=plain

      # GitHub's Linux runners have /dev/kvm, but not for the runner's user.
      # Without it the emulator falls back to software emulation (`-accel
      # off`) and does not finish booting inside the ten-minute timeout — the
      # log says "This user doesn't have permissions to use KVM". The rule is
      # the one android-emulator-runner's README gives.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The whole suite in one entrypoint. Per file it was 33 APK builds and
      # about twenty minutes; this is one build and about five, which is what
      # makes running it on every push affordable at all.
      - name: Integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # The phone the suite is written and checked on. With no profile the
          # AVD is 320x640, narrower than any phone this app targets, and 50
          # tests failed on overflows and on taps that landed off screen.
          profile: pixel_7
          # Off, because "remove animations" is not neutral here: the app reads
          # it as reduce-motion and draws the glass solid, skips the petal
          # burst and the stats reveal — the things bridge_test, burst_test and
          # stats_test exist to check. The suite was 76 red with it on.
          disable-animations: false
          working-directory: flutter_app
          script: flutter test integration_test/all_test.dart

      - name: Release APK builds
        working-directory: flutter_app
        run: flutter build apk --release
