name: Release

# Tag a version, get a signed APK attached to a GitHub release.
#
# Rewritten when the React Native tree was removed: this used to run
# `expo prebuild` and Gradle against the generated project, and EAS on top.
# There is no Expo any more, and no EAS account in the loop.
#
# Signing needs two secrets, and the release is built unsigned without them
# rather than silently falling back to the debug key — a debug-signed APK
# cannot be updated by a properly signed one later, so shipping one by
# accident is the mistake that surfaces months afterwards. See
# flutter_app/android/README.md.
#
#   ANDROID_KEYSTORE_BASE64   the .jks, base64 encoded
#   ANDROID_KEY_PROPERTIES    the key.properties contents, with storeFile
#                             pointing at android/keystore.jks

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Hoisted to the job: a step's own `env:` is not visible to that step's
    # `if:`, and a secret cannot be read from a step-level `if` at all.
    env:
      HAVE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Host toolchain for the tests, Android targets for the build. One
      # rustup can hold both; the tests are host binaries and would not run
      # under a target-only install.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            flutter_app/rust_bridge/target
          key: release-cargo-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock', 'flutter_app/rust_bridge/Cargo.lock') }}
          restore-keys: release-cargo-

      # A tag is not a licence to skip the checks. The goldens are the core's
      # contract with the app that shipped; the unit tests are its contract
      # with itself. Both are cheaper than a release that has to be un-tagged.
      - name: Core gate
        run: |
          npm run rust:fmt
          npm run rust:clippy
          npm run rust:test
          npm run bridge:fmt
          npm run bridge:clippy
          npm run goldens
          npm run tests:check
          cd flutter_app/android && ./gradlew :app:testDebugUnitTest --console=plain

      - name: Restore the signing key
        if: env.HAVE_KEY == 'true'
        working-directory: flutter_app/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > key.properties

      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Split-per-abi, through the same script the README tells a person to
      # run — not `flutter build apk` on its own. That writes a universal APK
      # at versionCode 1, and the arm64 split that goes on a phone is 2001:
      # once a phone has the split, a universal can never update it, and the
      # way out is an uninstall that takes the ledger with it.
      - name: Build
        run: node scripts/build-apk.js

      # The build stamps `-debugsigned` into the versionName when it found no
      # key, so this asks the artifact what happened rather than re-deriving
      # what the build decided. A tagged release that is debug-signed is a
      # release nobody can ever update, so it fails here instead of shipping.
      #
      # The capture group is `\1`. An earlier version of this line lost the
      # backslash — `sed` then treated `p` as the replacement text and the
      # check never matched anything. AGENTS.md's injection habit: an empty
      # VERSION is a failed check, not a free pass.
      - name: Refuse to publish a debug-signed release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: flutter_app
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          VERSION=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "versionName=$VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read versionName from $APK"
            exit 1
          fi
          case "$VERSION" in
            *-debugsigned)
              echo "::error::built with the debug key — set ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES"
              exit 1
              ;;
          esac

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
