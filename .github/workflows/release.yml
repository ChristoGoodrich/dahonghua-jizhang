name: Release

# Tag a version, get a signed APK attached to a GitHub release. Or run it by
# hand from the Actions tab with a version (`v1.1.0`): it then makes that tag
# itself, on the commit the run is on, which is how a release is cut from
# somewhere that cannot push a tag. Run by hand with no version, it builds
# and publishes nothing.
#
# Rewritten when the React Native tree was removed: this used to run
# `expo prebuild` and Gradle against the generated project, and EAS on top.
# There is no Expo any more, and no EAS account in the loop.
#
# Signing needs two secrets, and the release is built unsigned without them
# rather than silently falling back to the debug key — a debug-signed APK
# cannot be updated by a properly signed one later, so shipping one by
# accident is the mistake that surfaces months afterwards. See
# flutter_app/android/README.md.
#
#   ANDROID_KEYSTORE_BASE64   the .jks, base64 encoded
#   ANDROID_KEY_PROPERTIES    the key.properties contents: storePassword,
#                             keyPassword and keyAlias. Its storeFile is
#                             ignored — the step that writes the key says
#                             where it put it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, e.g. v1.1.0, tagged on the commit this run builds. Empty: build only.'
        required: false
        default: ''

# The release, and on a run by hand the tag with it, are written with the
# workflow's own token.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Hoisted to the job: a step's own `env:` is not visible to that step's
    # `if:`, and a secret cannot be read from a step-level `if` at all.
    env:
      HAVE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # The version this run releases: the tag that was pushed, or the one a
      # run by hand was given. Empty for a run by hand that only builds.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # What a release has to be before anything is built. Checked first, so
      # a mistake fails in seconds rather than after the build:
      #
      # - a version, `vMAJOR.MINOR.PATCH`, and the one pubspec says — a tag
      #   that disagrees with the APK's own versionName is a release that
      #   describes a different build;
      # - with its notes, `release-notes/<tag>.md`. Without them the release
      #   went up with an APK and no words, and a release whose notes do not
      #   say how to move from a debug-signed build is one that costs
      #   somebody their ledger;
      # - and, run by hand, a version not already released: this run makes
      #   the tag, and one that exists already names other code.
      - name: Release checks
        if: env.TAG != ''
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a version like v1.1.0"
            exit 1
          fi
          PUBSPEC=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' flutter_app/pubspec.yaml)
          if [ "v$PUBSPEC" != "$TAG" ]; then
            echo "::error::releasing $TAG, but flutter_app/pubspec.yaml says '$PUBSPEC'"
            exit 1
          fi
          NOTES="release-notes/$TAG.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::no $NOTES — write the release notes before releasing"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] &&
             git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists — a run by hand makes the tag, so pick the next version"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Host toolchain for the tests, Android targets for the build. One
      # rustup can hold both; the tests are host binaries and would not run
      # under a target-only install.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            flutter_app/rust_bridge/target
          key: release-cargo-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock', 'flutter_app/rust_bridge/Cargo.lock') }}
          restore-keys: release-cargo-

      # A tag is not a licence to skip the checks. The goldens are the core's
      # contract with the app that shipped; the unit tests are its contract
      # with itself. Both are cheaper than a release that has to be un-tagged.
      - name: Core gate
        run: |
          npm run rust:fmt
          npm run rust:clippy
          npm run rust:test
          npm run bridge:fmt
          npm run bridge:clippy
          npm run goldens
          npm run tests:check
          # The Gradle wrapper is gitignored and generated by Flutter; without
          # this line `./gradlew` does not exist. See ci.yml's Kotlin step.
          cd flutter_app
          flutter build apk --debug --config-only
          cd android && ./gradlew :app:testDebugUnitTest --console=plain

      # The secrets arrive through `env`, not pasted into the script: a
      # password with a `$`, a backtick or a quote in it was rewritten by the
      # shell before it was written down. A secret saved from a browser can
      # carry carriage returns, which `base64 -d` refuses, so they go.
      #
      # `storeFile` is this step's to say, not the secret's: Gradle reads it
      # relative to android/app, so the `android/keystore.jks` the docs once
      # gave pointed at a file that was never there. Whatever the secret
      # says, the line is replaced with the absolute path of the key written
      # here.
      - name: Restore the signing key
        if: env.HAVE_KEY == 'true'
        working-directory: flutter_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' |
            { grep -v '^[[:space:]]*storeFile[[:space:]]*[=:]' || true; } > key.properties
          printf 'storeFile=%s\n' "$PWD/keystore.jks" >> key.properties
          for k in storePassword keyPassword keyAlias; do
            if ! grep -q "^[[:space:]]*$k[[:space:]]*[=:]" key.properties; then
              echo "::error::ANDROID_KEY_PROPERTIES has no $k"
              exit 1
            fi
          done

      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Split-per-abi, through the same script the README tells a person to
      # run — not `flutter build apk` on its own. That writes a universal APK
      # at versionCode 1, and the arm64 split that goes on a phone is 2001:
      # once a phone has the split, a universal can never update it, and the
      # way out is an uninstall that takes the ledger with it.
      - name: Build
        run: node scripts/build-apk.js

      # The build stamps `-debugsigned` into the versionName when it found no
      # key, so this asks the artifact what happened rather than re-deriving
      # what the build decided. A tagged release that is debug-signed is a
      # release nobody can ever update, so it fails here instead of shipping.
      #
      # The capture group is `\1`. An earlier version of this line lost the
      # backslash — `sed` then treated `p` as the replacement text and the
      # check never matched anything. AGENTS.md's injection habit: an empty
      # VERSION is a failed check, not a free pass.
      - name: Refuse to publish a debug-signed release
        if: env.TAG != ''
        working-directory: flutter_app
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          VERSION=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "versionName=$VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read versionName from $APK"
            exit 1
          fi
          case "$VERSION" in
            *-debugsigned)
              echo "::error::built with the debug key — set ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES"
              exit 1
              ;;
          esac

      # On a run by hand the tag does not exist yet: the release creates it,
      # on the commit this run checked out and built. A tag made with the
      # workflow's own token starts no second run.
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        if: env.TAG != ''
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes/${{ env.TAG }}.md
          files: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  # The iPhone package, beside the APK: the same commit, built on a Mac and
  # left unsigned (see ios.yml and RELEASE.md, "On an iPhone"). After the APK
  # job, because that job makes the release — and on a run by hand, the tag —
  # and this one adds a file to it. Run by hand with no version it builds and
  # keeps the package as an artifact, as the APK job builds and publishes
  # nothing.
  ipa:
    needs: apk
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use the newest Xcode on the runner
        run: scripts/ios/select-xcode.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust for the iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build
        run: scripts/ios/build-ipa.sh

      - name: Keep the unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: dahonghua-ios-unsigned
          path: flutter_app/build/ios/dahonghua-ios-unsigned.ipa
          if-no-files-found: error

      # The release exists — the APK job made it — so this adds the file and
      # leaves the text as that job wrote it.
      - name: Add it to the release
        uses: softprops/action-gh-release@v3
        if: env.TAG != ''
        with:
          tag_name: ${{ env.TAG }}
          files: flutter_app/build/ios/dahonghua-ios-unsigned.ipa
