[package]
name = "dahonghua_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# The domain crate. The bridge owns the FFI-shaped types; the core stays pure
# and keeps answering to the parity harness rather than to Dart.
dahonghua-core = { path = "../../rust/core" }
# The ledger's storage. Rust owns the bytes now, not Dart — which means SQLite
# has to cross-compile to three Android ABIs, and `bundled` compiles it from
# source for each rather than trusting whatever libsqlite3 the phone ships.
dahonghua-store = { path = "../../rust/store" }

# Backup encryption. Here rather than in `core`: a cipher is not a decision the
# ledger needs to own, and `core` keeps its one dependency. AES-256-GCM over a
# PBKDF2-SHA256 key — what the shipping app used, with the iteration count
# carried in the envelope so it can be raised without breaking old files.
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
