// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.dahonghua_bridge'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.dahonghua_bridge'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    //
    // The scaffold shipped 33, which AGP now rejects against a Flutter app
    // compiling at 36. Following the app rather than pinning a number keeps the
    // two from drifting apart again.
    compileSdkVersion rootProject.ext.has('compileSdkVersion')
        ? rootProject.ext.compileSdkVersion
        : 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // 21 is Flutter's own floor; the app targets 26 for the notification
        // listener and the widget provider.
        minSdkVersion 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust_bridge"
    libname = "dahonghua_bridge"
}
